# Developer guardrail preset (Phase 2.7 + 6.15)
#
# Warn when prompts contain secrets; hard-block private keys and
# prompt-injection / jailbreak probes.
# Enable with:
#   presets:
#     - developer

policies:
  - name: warn-secrets
    when: input.contains_secret
    action: warn
    enabled: true

  - name: block-output-secrets
    when: output.contains_secret
    action: block
    enabled: true

  - name: block-private-keys
    when: input.contains_private_key
    action: block
    enabled: true

  - name: block-prompt-injection
    when: input.contains_injection
    action: block
    enabled: true

  - name: block-jailbreak
    when: input.contains_jailbreak
    action: block
    enabled: true
