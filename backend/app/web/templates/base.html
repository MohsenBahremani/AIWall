<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AIWall{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v=20260828c">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">AIWall{% block brand_suffix %}{% endblock %}</div>
        {% include "_topnav.html" %}
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        {% block footer %}Self-hosted AI security gateway{% endblock %}
    </footer>
</body>
</html>
